<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenClaw Agent</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0d1117;
      --bg-secondary: #161b22;
      --bg-tertiary: #21262d;
      --border: #30363d;
      --text: #e6edf3;
      --text-muted: #8b949e;
      --accent: #58a6ff;
      --accent-dim: #1f6feb;
      --user-bg: #1f6feb;
      --assistant-bg: #161b22;
      --tool-bg: #1c2128;
      --error: #f85149;
      --success: #3fb950;
      --font-mono: 'SF Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace;
      --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    }

    body {
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* --- Header --- */
    header {
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    header h1 {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    #status {
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    #status .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-muted);
    }

    #status.connected .dot { background: var(--success); }
    #status.error .dot { background: var(--error); }

    /* --- Messages --- */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      max-width: 780px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .message-role {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }

    .message.user .message-role { color: var(--accent); }

    .message-body {
      padding: 12px 16px;
      border-radius: 8px;
      line-height: 1.6;
      font-size: 14px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .message.user .message-body {
      background: var(--user-bg);
      border-radius: 8px 8px 2px 8px;
    }

    .message.assistant .message-body {
      background: var(--assistant-bg);
      border: 1px solid var(--border);
      border-radius: 8px 8px 8px 2px;
      font-family: var(--font-sans);
    }

    .message.assistant .message-body code {
      font-family: var(--font-mono);
      background: var(--bg-tertiary);
      padding: 1px 5px;
      border-radius: 3px;
      font-size: 13px;
    }

    .message.assistant .message-body pre {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      margin: 8px 0;
      overflow-x: auto;
      font-family: var(--font-mono);
      font-size: 13px;
      line-height: 1.5;
    }

    .message.assistant .message-body pre code {
      background: none;
      padding: 0;
    }

    /* --- Tool events --- */
    .tool-event {
      max-width: 780px;
      width: 100%;
      margin: 0 auto;
      font-size: 12px;
      font-family: var(--font-mono);
      color: var(--text-muted);
      padding: 4px 12px;
      background: var(--tool-bg);
      border-radius: 4px;
      border-left: 3px solid var(--accent-dim);
    }

    .tool-event.result {
      border-left-color: var(--success);
    }

    .tool-event.error {
      border-left-color: var(--error);
      color: var(--error);
    }

    .tool-event.compaction {
      border-left-color: #d2a8ff;
      color: #d2a8ff;
    }

    /* --- Streaming indicator --- */
    .streaming .message-body::after {
      content: '';
      display: inline-block;
      width: 6px;
      height: 16px;
      background: var(--accent);
      margin-left: 2px;
      vertical-align: text-bottom;
      animation: blink 1s step-end infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    /* --- Input --- */
    #input-area {
      padding: 16px 20px;
      border-top: 1px solid var(--border);
      background: var(--bg-secondary);
      flex-shrink: 0;
    }

    #input-form {
      max-width: 780px;
      margin: 0 auto;
      display: flex;
      gap: 8px;
    }

    #input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 14px;
      resize: none;
      outline: none;
      min-height: 42px;
      max-height: 200px;
      line-height: 1.5;
    }

    #input:focus { border-color: var(--accent); }

    #input::placeholder { color: var(--text-muted); }

    #send-btn {
      background: var(--accent-dim);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 0 20px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      align-self: flex-end;
      height: 42px;
      transition: background 0.15s;
    }

    #send-btn:hover { background: var(--accent); }
    #send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* --- Scrollbar --- */
    #messages::-webkit-scrollbar { width: 6px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  </style>
</head>
<body>
  <header>
    <h1>OpenClaw Agent</h1>
    <div id="status">
      <span class="dot"></span>
      <span class="label">Connecting...</span>
    </div>
  </header>

  <div id="messages"></div>

  <div id="input-area">
    <form id="input-form">
      <textarea id="input" rows="1" placeholder="Send a message..." autofocus></textarea>
      <button id="send-btn" type="submit">Send</button>
    </form>
  </div>

  <script>
    // --- State ---
    let ws = null;
    let currentMessageEl = null;
    let currentText = '';
    let isStreaming = false;

    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('input');
    const formEl = document.getElementById('input-form');
    const sendBtn = document.getElementById('send-btn');
    const statusEl = document.getElementById('status');

    // --- WebSocket ---
    function connect() {
      const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(`${proto}//${location.host}`);

      ws.onopen = () => {
        setStatus('connected', 'Connected');
      };

      ws.onclose = () => {
        setStatus('error', 'Disconnected');
        setTimeout(connect, 2000);
      };

      ws.onerror = () => {
        setStatus('error', 'Connection error');
      };

      ws.onmessage = (event) => {
        const data = JSON.parse(event.data);
        handleMessage(data);
      };
    }

    function setStatus(cls, text) {
      statusEl.className = cls;
      statusEl.querySelector('.label').textContent = text;
    }

    // --- Message handlers ---
    function handleMessage(data) {
      switch (data.type) {
        case 'connected':
          break;

        case 'chat_start':
          currentText = '';
          currentMessageEl = addMessage('assistant', '');
          currentMessageEl.classList.add('streaming');
          isStreaming = true;
          sendBtn.disabled = true;
          break;

        case 'chat_delta':
          currentText += data.text;
          if (currentMessageEl) {
            currentMessageEl.querySelector('.message-body').innerHTML = renderMarkdown(currentText);
          }
          scrollToBottom();
          break;

        case 'chat_end':
          if (currentMessageEl) {
            currentMessageEl.classList.remove('streaming');
            currentMessageEl.querySelector('.message-body').innerHTML = renderMarkdown(data.text || currentText);
          }
          currentMessageEl = null;
          isStreaming = false;
          sendBtn.disabled = false;
          scrollToBottom();
          break;

        case 'tool_use':
          addToolEvent(`Using tool: ${data.tool}`);
          break;

        case 'tool_result':
          addToolEvent(`Tool result received`, 'result');
          break;

        case 'compaction':
          addToolEvent('Context compacted — memories flushed to disk', 'compaction');
          break;

        case 'error':
          if (currentMessageEl) {
            currentMessageEl.classList.remove('streaming');
          }
          addToolEvent(`Error: ${data.message}`, 'error');
          isStreaming = false;
          sendBtn.disabled = false;
          break;
      }
    }

    // --- DOM helpers ---
    function addMessage(role, text) {
      const el = document.createElement('div');
      el.className = `message ${role}`;
      el.innerHTML = `
        <div class="message-role">${role}</div>
        <div class="message-body">${role === 'assistant' ? renderMarkdown(text) : escapeHtml(text)}</div>
      `;
      messagesEl.appendChild(el);
      scrollToBottom();
      return el;
    }

    function addToolEvent(text, cls = '') {
      const el = document.createElement('div');
      el.className = `tool-event ${cls}`;
      el.textContent = text;
      messagesEl.appendChild(el);
      scrollToBottom();
    }

    function scrollToBottom() {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    // --- Simple markdown rendering ---
    function renderMarkdown(text) {
      if (!text) return '';

      // Escape HTML first
      let html = escapeHtml(text);

      // Code blocks (```...```)
      html = html.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>');

      // Inline code
      html = html.replace(/`([^`]+)`/g, '<code>$1</code>');

      // Bold
      html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');

      // Italic
      html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');

      // Line breaks (preserve whitespace for pre-wrap)
      return html;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // --- Input handling ---
    formEl.addEventListener('submit', (e) => {
      e.preventDefault();
      sendChat();
    });

    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendChat();
      }
    });

    // Auto-resize textarea
    inputEl.addEventListener('input', () => {
      inputEl.style.height = 'auto';
      inputEl.style.height = Math.min(inputEl.scrollHeight, 200) + 'px';
    });

    function sendChat() {
      const text = inputEl.value.trim();
      if (!text || isStreaming) return;

      addMessage('user', text);
      ws.send(JSON.stringify({ type: 'chat', message: text }));

      inputEl.value = '';
      inputEl.style.height = 'auto';
    }

    // --- Init ---
    connect();
  </script>
</body>
</html>
